services:
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATA_PROCESSOR_URL=http://data-processor:8000
      - ROUTER_URL=http://router:8000
    depends_on:
      - data-processor
      - router

  data-processor:
    build:
      context: .
      dockerfile: services/data-processor/Dockerfile
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      - DB_HOST=postgis
      - DB_PORT=5432
      - DB_NAME=nav_mas
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    volumes:
      - ./configs:/app/configs

  router:
    build:
      context: .
      dockerfile: services/router/Dockerfile
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      - DB_HOST=postgis
      - DB_PORT=5432
      - DB_NAME=nav_mas
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    volumes:
      - ./configs:/app/configs

  # Agent Validation Service (Qt Client via VNC)
  # User runs native client via `make gui`
  qt-client-web:
    build:
      context: .
      dockerfile: services/qt-client-web/Dockerfile
    ports:
      - "6080:6080" # Web VNC
    environment:
      - DISPLAY=:0
      - RESOLUTION=1280x800x24
      - GATEWAY_URL=http://gateway:8000
      - SERVER_URL=http://gateway:8000
      - PYTHONPATH=/app
    volumes:
      - ./services/qt-client:/app/services/qt-client
      - ./services/common:/app/services/common
      - ./configs:/app/configs
    depends_on:
      - gateway
      - data-processor



  postgis:
    image: pgrouting/pgrouting:17-3.5-3.8
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=nav_mas
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgis_data:
  grafana_data:
