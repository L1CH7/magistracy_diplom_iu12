# Docker Compose для мультиагентной навигационной системы
services:
  # PostgreSQL + PostGIS для хранения графа дорог
  postgis:
    image: pgrouting/pgrouting:17-3.5-3.8
    container_name: diplom-postgis
    environment:
      POSTGRES_DB: osm
      POSTGRES_USER: diplom
      POSTGRES_PASSWORD: diplom_pass
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - nav-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diplom -d osm"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  # Redis для кэша Traffic Manager
  redis:
    image: redis:7-alpine
    container_name: diplom-redis
    ports:
      - "6379:6379"
    networks:
      - nav-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
  
  # Simulation Service - агентная симуляция движения
  simulation:
    build:
      context: .
      dockerfile: services/simulation/Dockerfile
      cache_from:
        - diplom-simulation:latest
    image: diplom-simulation:latest
    container_name: diplom-simulation
    ports:
      - "8001:8001"
    environment:
      POSTGRES_HOST: postgis
      POSTGRES_PORT: 5432
      POSTGRES_DB: osm
      POSTGRES_USER: diplom
      POSTGRES_PASSWORD: diplom_pass
    volumes:
      - ./logs/simulation:/app/logs
      - ./configs:/app/configs:ro
    networks:
      - nav-net
    depends_on:
      postgis:
        condition: service_healthy
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./services/simulation/src
          target: /app/src
        - action: rebuild
          path: ./services/simulation/Dockerfile
  
  # Coordinator Service - оркестрация маршрутов и WebSocket
  coordinator:
    build:
      context: .
      dockerfile: services/coordinator/Dockerfile
      cache_from:
        - diplom-coordinator:latest
    image: diplom-coordinator:latest
    container_name: diplom-coordinator
    ports:
      - "8002:8002"
    environment:
      SIMULATION_URL: http://simulation:8001
      ROUTER_URL: http://router:8003
      TRAFFIC_URL: http://traffic-manager:8004
    volumes:
      - ./logs/coordinator:/app/logs
      - ./configs:/app/configs:ro
    networks:
      - nav-net
    depends_on:
      - simulation
      - router
    restart: unless-stopped
  
  # Router Service - routing graph management and routing API
  router:
    build:
      context: .
      dockerfile: Dockerfile.router
      cache_from:
        - diplom-router:latest
    image: diplom-router:latest
    container_name: diplom-router
    ports:
      - "8006:8006"
    environment:
      DB_HOST: postgis
      DB_PORT: 5432
      DB_NAME: osm
      DB_USER: diplom
      DB_PASSWORD: diplom_pass
    volumes:
      - ./logs/router:/app/logs
      - ./configs:/app/configs:ro
    networks:
      - nav-net
    depends_on:
      postgis:
        condition: service_healthy
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./services/router/src
          target: /app/src
        - action: rebuild
          path: ./Dockerfile.router
  
  # Traffic Manager Service - мониторинг нагрузки, кэш в Redis
  traffic-manager:
    build:
      context: .
      dockerfile: services/traffic-manager/Dockerfile
      cache_from:
        - diplom-traffic-manager:latest
    image: diplom-traffic-manager:latest
    container_name: diplom-traffic-manager
    ports:
      - "8004:8004"
    environment:
      POSTGRES_HOST: postgis
      POSTGRES_PORT: 5432
      POSTGRES_DB: osm
      POSTGRES_USER: diplom
      POSTGRES_PASSWORD: diplom_pass
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./logs/traffic-manager:/app/logs
      - ./configs:/app/configs:ro
    networks:
      - nav-net
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./services/traffic-manager/src
          target: /app/src
        - action: rebuild
          path: ./services/traffic-manager/Dockerfile
  
  # Data Processor Service - загрузка OSM и обработка графа
  data-processor:
    build:
      context: .
      dockerfile: services/data-processor/Dockerfile
      cache_from:
        - diplom-data-processor:latest
    image: diplom-data-processor:latest
    container_name: diplom-data-processor
    ports:
      - "8005:8005"
    environment:
      POSTGRES_HOST: postgis
      POSTGRES_PORT: 5432
      POSTGRES_DB: osm
      POSTGRES_USER: diplom
      POSTGRES_PASSWORD: diplom_pass
    volumes:
      - ./logs/data-processor:/app/logs
      - ./data:/app/data
      - ./configs:/app/configs:ro
    networks:
      - nav-net
    depends_on:
      postgis:
        condition: service_healthy
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./services/data-processor/src
          target: /app/src
        - action: sync
          path: ./src/utils
          target: /app/src/utils
        - action: rebuild
          path: ./services/data-processor/Dockerfile
  
  # Legacy Server (для GUI compatibility - /osm/fetch_road_graph)
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
      cache_from:
        - diplom-server:latest
    image: diplom-server:latest
    container_name: diplom-server
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgis
      POSTGRES_PORT: 5432
      POSTGRES_DB: osm
      POSTGRES_USER: diplom
      POSTGRES_PASSWORD: diplom_pass
      OSM_JSON_PATH: /app/data/osm_data.json
    volumes:
      - ./data:/app/data
      - ./logs/server:/app/logs
      - ./configs:/app/configs:ro
    networks:
      - nav-net
    depends_on:
      postgis:
        condition: service_healthy
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./src/server
          target: /app/src/server
        - action: rebuild
          path: ./Dockerfile.server
  
  # Loki (агрегация логов)
  loki:
    image: grafana/loki:latest
    container_name: diplom-loki
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/tmp/loki
    command: -config.file=/etc/loki/local-config.yaml
    environment:
      - TZ=Europe/Moscow
    networks:
      - nav-net
  
  # Promtail (log shipping)
  promtail:
    image: grafana/promtail:latest
    container_name: diplom-promtail
    volumes:
      - ./logs:/var/log/app:ro
      - ./configs/promtail-config.yaml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - nav-net
  
  # Grafana (visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: diplom-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
    networks:
      - nav-net

networks:
  nav-net:
    driver: bridge

volumes:
  postgis_data:
    driver: local
  loki_data:
    driver: local
  grafana_data:
    driver: local
