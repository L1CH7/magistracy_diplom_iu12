---

services:
  # PostgreSQL with PostGIS for road graph storage
  postgis:
    image: postgis/postgis:16-3.4
    container_name: diplom-postgis
    environment:
      POSTGRES_DB: road_graphs
      POSTGRES_USER: diplom
      POSTGRES_PASSWORD: diplom_pass
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - nav-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diplom -d road_graphs"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
      cache_from:
        - diplom-server:latest
    image: diplom-server:latest
    ports:
      - "8000:8000"
    environment:
      OSM_JSON_PATH: /app/data/osm_data.json
      POSTGRES_HOST: postgis
      POSTGRES_PORT: 5432
      POSTGRES_DB: road_graphs
      POSTGRES_USER: diplom
      POSTGRES_PASSWORD: diplom_pass
    volumes:
      - ./data:/app/data
    networks:
      - nav-net
    depends_on:
      postgis:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: ./Dockerfile.server

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
      cache_from:
        - diplom-client:latest
    image: diplom-client:latest
    depends_on:
      - server
    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"
      QT_QPA_PLATFORM: xcb
      QTWEBENGINE_DISABLE_SANDBOX: "1"
      QT_DEBUG_PLUGINS: "1"
      QTWEBENGINE_CHROMIUM_FLAGS: --enable-gpu-rasterization --ignore-gpu-blocklist
      TILE_URL: ${TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ~/.Xauthority:/root/.Xauthority:rw
      - /dev/shm:/dev/shm
    devices:
      - /dev/dri:/dev/dri
    networks:
      - nav-net
    stdin_open: true
    tty: true
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: ./Dockerfile.client

networks:
  nav-net:
    driver: bridge

volumes:
  postgis_data:
    driver: local
