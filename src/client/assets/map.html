<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MapLibre Client</title>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    html, body, #map { height: 100%; width: 100%; margin: 0; padding: 0; }
    .marker-agent { width: 16px; height: 16px; border-radius: 50%; background: #22c55e; border: 2px solid #065f46; }
    .marker-start { width: 14px; height: 14px; border-radius: 50%; background: #2563eb; border: 2px solid #1e3a8a; }
    .marker-end { width: 14px; height: 14px; border-radius: 50%; background: #ef4444; border: 2px solid #7f1d1d; }
    .marker-via { width: 10px; height: 10px; border-radius: 50%; background: #f59e0b; border: 2px solid #92400e; }
    .maplibregl-ctrl-logo, .maplibregl-ctrl-attrib { opacity: .7; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script>
  // Wait for TILE_URL to be injected by PyQt, then initialize map
  let mapInitialized = false;
  let tileUrl = null;
  let map = null; // will be set in initializeMap()
  
  // Global variables for picking
  let startPt = null;
  let endPt = null;
  let viaPts = [];
  let allMarkers = [];
  let contextMenuPos = null;
  let startMarker = null;
  let endMarker = null;
  let mapLoaded = false;  // Tracks if map.on('load') has fired
  
  // Queue for operations before map is ready
  let pendingOperations = [];
  
  // Helper function to create marker element
  function createMarkerElement(color) {
    const el = document.createElement('div');
    const isFrom = (color === '#2563eb');
    const isTo = (color === '#dc2626');
    
    if (isFrom || isTo) {
      el.style.width = '16px';
      el.style.height = '16px';
      el.style.borderRadius = '50%';
      el.style.backgroundColor = '#ffffff';
      el.style.border = '2px solid ' + color;
    } else {
      el.style.width = '10px';
      el.style.height = '10px';
      el.style.borderRadius = '50%';
      el.style.backgroundColor = color;
      el.style.border = '2px solid #000000';
    }
    return el;
  }
  
  // Real functions that work with map
  function _addMarkerToMap(lngLat, color) {
    if (!map || !mapLoaded) return null;
    const el = createMarkerElement(color);
    const marker = new maplibregl.Marker({ element: el, pitchAlignment: 'map', rotationAlignment: 'map' });
    const lng = lngLat.lon !== undefined ? lngLat.lon : lngLat.lng;
    const lat = lngLat.lat;
    marker.setLngLat([lng, lat]).addTo(map);
    allMarkers.push(marker);
    return marker;
  }
  
  function setStart(lngLat) {
    if (!mapLoaded) {
      pendingOperations.push({ type: 'setStart', lngLat });
      return;
    }
    startPt = { lng: lngLat.lng || lngLat.lon, lat: lngLat.lat };
    if (startMarker) startMarker.remove();
    startMarker = _addMarkerToMap(lngLat, '#2563eb');
  }
  
  function setEnd(lngLat) {
    if (!mapLoaded) {
      pendingOperations.push({ type: 'setEnd', lngLat });
      return;
    }
    endPt = { lng: lngLat.lng || lngLat.lon, lat: lngLat.lat };
    if (endMarker) endMarker.remove();
    endMarker = _addMarkerToMap(lngLat, '#dc2626');
  }
  
  function addMarker(lngLat, color) {
    if (!mapLoaded) {
      pendingOperations.push({ type: 'addMarker', lngLat, color });
      return;
    }
    return _addMarkerToMap(lngLat, color || '#8b5cf6');
  }
  
  function addVia(lngLat) {
    return addMarker(lngLat, '#f59e0b');
  }
  
  function clearVia() {
    if (!mapLoaded) return;
    allMarkers.forEach(m => m.remove());
    allMarkers = [];
  }
  
  function clearAllMarkers() {
    startPt = null;
    endPt = null;
    allMarkers.forEach(m => m.remove());
    allMarkers = [];
    if (startMarker) {
      startMarker.remove();
      startMarker = null;
    }
    if (endMarker) {
      endMarker.remove();
      endMarker = null;
    }
  }
  
  function getPickedPoints() {
    return { start: startPt, end: endPt, via: viaPts.slice() };
  }
  
  function setPickMode(mode) {
    console.log('setPickMode:', mode);
  }
  
  function clearPicked() {
    clearAllMarkers();
  }
  
  function ensureMarker(color) {
    const el = createMarkerElement(color);
    return new maplibregl.Marker({ element: el, pitchAlignment: 'map', rotationAlignment: 'map' });
  }
  
  // Map methods will be available through window.map after init
  // Create stubs just in case
  window.map = {
    getZoom: function() { return 12; },
    setZoom: function(z) {},
    zoomIn: function() {},
    zoomOut: function() {},
    getBounds: function() { return null; },
    getCanvas: function() { return null; },
    on: function() {},
  };

  function initializeMap() {
    if (mapInitialized) return;
    mapInitialized = true;

    tileUrl = window.TILE_URL || 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';

    // Create map
  map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          osm: {
            type: 'raster',
            tiles: [tileUrl],
            tileSize: 256,
          },
          graph: { type: 'geojson', data: { type: 'FeatureCollection', features: [] } },
          routes: { type: 'geojson', data: { type: 'FeatureCollection', features: [] } },
        },
        layers: [
          { id: 'background', type: 'background', paint: { 'background-color': '#f3f4f6' } },
          { id: 'osm', type: 'raster', source: 'osm' },
          { id: 'graph', type: 'line', source: 'graph', paint: { 'line-color': '#9ca3af', 'line-width': 1 } },
          { id: 'routes', type: 'line', source: 'routes', paint: { 'line-color': ['get', 'color'], 'line-width': 3 } },
        ]
      },
      center: [37.6173, 55.7558],
      zoom: 12,
      hash: false,
      attributionControl: true,
      antialias: true,
    });

    // Agent marker + smooth animation
    const agentEl = document.createElement('div');
    agentEl.className = 'marker-agent';
    const agentMarker = new maplibregl.Marker({ element: agentEl, pitchAlignment: 'map', rotationAlignment: 'map' });
    let agentCur = null; // [lng, lat]
    let agentTarget = null; // [lng, lat]
    let lastFrame = 0;

    function lerp(a, b, t) { return a + (b - a) * t; }

    function animate(ts) {
      requestAnimationFrame(animate);
      if (!agentCur || !agentTarget || !map) return;
      const dt = Math.min((ts - lastFrame) / 1000, 0.05); // cap step
      lastFrame = ts;
      const alpha = 0.25; // smoothing factor
      const next = [
        lerp(agentCur[0], agentTarget[0], alpha),
        lerp(agentCur[1], agentTarget[1], alpha)
      ];
      agentCur = next;
      agentMarker.setLngLat(next);
      if (!agentMarker._map) agentMarker.addTo(map);
    }
  requestAnimationFrame(animate);

  // Expose map globally for PyQt callbacks
  window.map = map;
    
    // Setup map event listeners after map is fully loaded
    // All map operations must be inside this callback
    map.on('load', () => {
      console.log('Map loaded successfully');
      
      // Mark map as loaded for all functions
      mapLoaded = true;
      
      // Process any pending operations that happened before map was ready
      const ops = pendingOperations.slice();
      pendingOperations = [];
      ops.forEach(op => {
        switch(op.type) {
          case 'setStart':
            setStart(op.lngLat);
            break;
          case 'setEnd':
            setEnd(op.lngLat);
            break;
          case 'addMarker':
            addMarker(op.lngLat, op.color);
            break;
        }
      });

      // Basic error logging
      map.on('error', (e) => {
        try {
          console.log('[MapLibre error]', e && (e.error && e.error.message ? e.error.message : JSON.stringify(e)));
        } catch (err) {
          // ignore
        }
      });

      // Track last mouse position for Ctrl shortcuts
      let lastMousePosition = null; // {lon, lat}
      map.on('mousemove', (e) => {
        lastMousePosition = { lon: e.lngLat.lng, lat: e.lngLat.lat };
        window.lastMousePosition = lastMousePosition; // expose to Python
      });

      // Zoom changed - notify PyQt to update slider
      let _skip_next_zoom_update = false;
      map.on('zoom', () => {
        const zoom = map.getZoom();
        const fromUI = !_skip_next_zoom_update;
        _skip_next_zoom_update = false;
        
        if (fromUI) {
          try {
            fetch(`http://127.0.0.1:9999/api/zoom?value=${zoom}`)
              .catch(() => {});
          } catch (e) {}
        }
        
        if (window.onZoomChanged) {
          window.onZoomChanged(zoom, fromUI);
        }
      });

      // Right-click context menu for picking
      map.getCanvas().addEventListener('contextmenu', (e) => {
        e.preventDefault();
        contextMenuPos = map.unproject([e.clientX, e.clientY]);
        window.lastContextMenuPos = contextMenuPos;
        console.log('Right-click at:', contextMenuPos);
        if (window.onMapContextMenu) {
          window.onMapContextMenu(contextMenuPos);
        }
      });
    }); // end of map.on('load')
    // setPickMode is now a no-op; picking is via right-click context menu
    function setPickMode(mode) {
      console.log('setPickMode called with:', mode, '(deprecated; use context menu)');
    }
    function clearPicked() {
      clearAllMarkers();
    }

    // Public API bridged from PyQt
    window.app = {
      setGraphGeoJSON(geojson) {
        const src = map.getSource('graph');
        if (src) src.setData(geojson);
      },
      fitToGraph() {
        const src = map.getSource('graph');
        if (!src) return;
        const data = src._data || src._options?.data;
        if (!data || !data.features || data.features.length === 0) return;
        const coords = data.features.flatMap(f => f.geometry.coordinates);
        if (!coords || coords.length === 0) return;
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        coords.forEach(([x, y]) => {
          if (x < minX) minX = x; if (y < minY) minY = y;
          if (x > maxX) maxX = x; if (y > maxY) maxY = y;
        });
        if (isFinite(minX)) {
          map.fitBounds(
            [[minX, minY], [maxX, maxY]],
            { padding: 40, duration: 400, maxZoom: 16 }
          );
        }
      },
      setRoutes(routes) {
        // routes: [{ id, coords: [[lon,lat], ...], color?: '#rrggbb' }]
        const features = routes.map(r => ({
          type: 'Feature',
          properties: { id: r.id ?? '', color: r.color ?? '#2563eb' },
          geometry: { type: 'LineString', coordinates: r.coords }
        }));
        const src = map.getSource('routes');
        if (src) src.setData({ type: 'FeatureCollection', features });
      },
      updateAgent(pos) {
        // pos: { lat, lon }
        const lngLat = [pos.lon, pos.lat];
        if (!agentCur) agentCur = lngLat;
        agentTarget = lngLat;
      },
      fitToRoutes() {
        const src = map.getSource('routes');
        if (!src) return;
        const data = src._data || src._options?.data;
        if (!data || !data.features || data.features.length === 0) return;
        const coords = data.features.flatMap(f => f.geometry.coordinates);
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        coords.forEach(([x, y]) => {
          if (x < minX) minX = x; if (y < minY) minY = y;
          if (x > maxX) maxX = x; if (y > maxY) maxY = y;
        });
        if (isFinite(minX)) {
          map.fitBounds(
            [[minX, minY], [maxX, maxY]],
            { padding: 60, duration: 600, maxZoom: 16 }
          );
        }
      },
      addMarker(lngLat, color = '#8b5cf6') {
        return addMarker(lngLat, color);
      },
      setPickMode,
      getPickedPoints,
      clearPicked,
      setStart,
      setEnd,
      addVia,
      clearVia,
      clearAllMarkers,
      zoomIn() {
        if (map) map.zoomIn();
      },
      zoomOut() {
        if (map) map.zoomOut();
      },
      setZoom(level) {
        if (map) {
          _skip_next_zoom_update = true;  // Mark that this zoom change came from Python
          map.setZoom(level);
        }
      },
      getZoom() {
        if (map) return map.getZoom();
        return null;
      },
    };
  } // end of initializeMap()

  // Call initializeMap as soon as TILE_URL is available
  // PyQt will set window.TILE_URL, then we init
  console.log('Script started, map=' + (typeof map));
  console.log('Checking for TILE_URL...');
  if (window.TILE_URL) {
    console.log('TILE_URL found immediately:', window.TILE_URL);
    initializeMap();
  } else {
    // Small delay to wait for PyQt injection
    console.log('TILE_URL not found, waiting 100ms...');
    setTimeout(() => {
      if (window.TILE_URL) {
        console.log('TILE_URL found after delay:', window.TILE_URL);
        initializeMap();
      } else {
        console.error('TILE_URL NOT SET! Using OSM fallback.');
        window.TILE_URL = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
        initializeMap();
      }
    }, 100);
  }
  </script>
</body>
</html>
