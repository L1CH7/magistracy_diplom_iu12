# Data Processor Configuration

tiles:
  # OSM tile size (degrees)
  size_degrees: 0.05
  
  # Download settings
  timeout: 60  # seconds per tile
  retry_count: 3
  delay_between_tiles: 0.5  # seconds to avoid rate limiting

storage:
  # PostgreSQL schema for tiles
  schema: "osm"
  table: "ways"

logging:
  level: "DEBUG"
  format: "{time:YYYY-MM-DD HH:mm:ss.SSS} | {level: <8} | {message}"
