# Simulation Configuration
# Agent simulation parameters, FPS, speed control

# Simulation speed (multiplier)
speed:
  default: 30.0      # 30x real-time
  min: 0.25          # 0.25x (slow motion)
  max: 100.0         # 100x (fast forward)
  step: 1.0          # Increment step

# Rendering FPS (UI update rate)
fps:
  default: 30
  min: 1
  max: 60

# Agent default parameters
agent:
  max_speed_kmh: 50.0        # Default speed limit (km/h)
  length_m: 4.5              # Vehicle length (meters)
  width_m: 1.8               # Vehicle width (meters)
  max_speed_theoretical_kmh: 200.0  # Max possible speed

# Teleportation detection
teleport_detection:
  enabled: true              # Enable/disable checks
  threshold_multiplier: 1.1  # 10% margin over critical distance

# Agent states (for UI display)
agent_states:
  moving: 'Moving'
  stopped: 'Stopped'
  waiting_traffic_light: 'Waiting (Traffic Light)'
  congestion: 'In Congestion'
