# LOD (Level of Detail) Configuration
# 4-layer progressive detail system for map rendering

layers:
  - name: highways
    minzoom: 0
    maxzoom: 8
    highways:
      - motorway
      - motorway_link
      - trunk
      - trunk_link
    show_names: false
    show_refs: true    # Highway refs (M-11, A-107)
    show_lanes: false
    show_maxspeed: false
    show_surface: false
    base_width: 0.5
  
  - name: major_roads
    minzoom: 8
    maxzoom: 11
    highways:
      - motorway
      - motorway_link
      - trunk
      - trunk_link
      - primary
      - primary_link
    show_names: false
    show_refs: true
    show_lanes: false
    show_maxspeed: false
    show_surface: false
    base_width: 1.5
  
  - name: arterial_roads
    minzoom: 11
    maxzoom: 14
    highways:
      - motorway
      - motorway_link
      - trunk
      - trunk_link
      - primary
      - primary_link
      - secondary
      - secondary_link
      - tertiary
      - tertiary_link
    show_names: true   # Show street names
    show_refs: true
    show_lanes: true   # Show lane count
    show_maxspeed: false
    show_surface: false
    base_width: 2.0
  
  - name: all_roads
    minzoom: 14
    maxzoom: 24
    highways:
      - motorway
      - motorway_link
      - trunk
      - trunk_link
      - primary
      - primary_link
      - secondary
      - secondary_link
      - tertiary
      - tertiary_link
      - residential
      - living_street
      - unclassified
      - service
    show_names: true
    show_refs: true
    show_lanes: true
    show_maxspeed: true   # Show speed limit
    show_surface: true    # Road surface (asphalt/concrete)
    base_width: 2.5
