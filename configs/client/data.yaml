# Client Data Configuration
# API endpoints, test bboxes, cache settings

api:
  # Server base URL (use environment variable in production)
  base_url: "http://server:8000"
  
  # API timeouts (seconds)
  timeout_default: 30
  timeout_graph_fetch: 600  # 10 minutes for large bbox downloads
  timeout_route: 60

bboxes:
  # Test bounding boxes for development
  # Format: [min_lon, min_lat, max_lon, max_lat]
  
  moscow_small:
    coords: [37.5609, 55.7510, 37.6016, 55.7631]
    description: "Small Moscow region (quick testing)"
  
  moscow_center:
    coords: [37.4, 55.5, 37.9, 55.9]
    description: "Moscow city center"
  
  moscow_medium:
    coords: [37.50, 55.70, 37.75, 55.95]
    description: "Moscow medium (25 tiles 5x5 @ 0.05°)"
  
  moscow_mkad:
    coords: [37.32, 55.49, 37.90, 55.93]
    description: "Moscow MKAD +5km"
  
  # Active bbox for initial load
  default: moscow_medium

graph:
  # Display limits for graph rendering
  max_edges_display: 5000
  max_nodes_display: 10000
  
  # Drivable highway types (for filtering)
  drivable_types:
    - motorway
    - motorway_link
    - trunk
    - trunk_link
    - primary
    - primary_link
    - secondary
    - secondary_link
    - tertiary
    - tertiary_link
    - unclassified
    - residential
    - living_street
    - service
