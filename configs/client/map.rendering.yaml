# Map Rendering Configuration
# Colors, widths, highway groups, and rendering parameters

# Color coding by highway type
colors:
  motorway: '#1e40af'        # Dark blue
  motorway_link: '#1e40af'
  trunk: '#6200ffff'         # Purple
  trunk_link: '#6200ffff'
  primary: '#9c00aaff'       # Magenta
  primary_link: '#9c00aaff'
  secondary: '#ff5effff'     # Pink
  secondary_link: '#ff5effff'
  tertiary: '#ff2e2eff'      # Red-orange
  tertiary_link: '#ff2e2eff'
  residential: '#ff8635ff'   # Orange
  living_street: '#ff8635ff'
  unclassified: '#5c5c5cff'  # Gray
  service: '#008d0cff'       # Green
  default: '#353535ff'       # Dark gray

# Base width by highway type at zoom 18 (pixels)
# These values match old hardcoded values for maximum zoom
widths:
  motorway: 3
  motorway_link: 3
  trunk: 3
  trunk_link: 3
  primary: 3
  primary_link: 3
  secondary: 3
  secondary_link: 3
  tertiary: 3
  tertiary_link: 3
  residential: 3
  living_street: 3
  unclassified: 3
  service: 3
  default: 3
  # motorway: 12
  # motorway_link: 9
  # trunk: 10
  # trunk_link: 9
  # primary: 9
  # primary_link: 7
  # secondary: 7
  # secondary_link: 6
  # tertiary: 6
  # tertiary_link: 5
  # residential: 5
  # living_street: 3
  # unclassified: 3
  # service: 3
  # default: 3

# Highway type groups (for filtering)
highway_groups:
  motorway:
    - motorway
    - motorway_link
  
  major:
    - trunk
    - trunk_link
    - primary
    - primary_link
    - secondary
    - secondary_link
  
  minor:
    - tertiary
    - tertiary_link
    - residential
    - living_street
    - unclassified
    - service

# MapLibre GL rendering parameters
rendering:
  # Moved glyphs to map.yaml > style.glyphs
