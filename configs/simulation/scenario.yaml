# Simulation Traffic Scenario (Hub & Spoke Model + Diurnal Active Volume Curve)
scenario:
  name: kazan_hubs
  hubs_ratio: 0.70  # 70% traffic between hubs, 30% random
  smoothness: 1.0   # Smoothstep interpolation between profile points
  dt_sec: 0.1       # Physics step size in seconds (100ms)

  # Population Distribution (Percentages, must sum to 1.0)
  populations:
    commuters: 0.65       # Home <-> Work trip-chaining (no teleportation)
    commercial: 0.20      # Continuous hub-to-hub freight/taxi trips
    public_transport: 0.05 # Fixed route stop loops
    random: 0.10          # Random background trips

  # Rush-Hour Parameters for Commuter Hazard Rate
  schedules:
    morning_peak_hour: 8.0
    evening_peak_hour: 18.0
    gaussian_sigma_hours: 1.0  # Jitter spread around peaks

  # Diurnal active volume curve (defines % of max_agents active on roads by hour 0..23)
  # Strictly following scientific supervisor's intervals with 100% peak normalization (/ 0.8)
  volume_profile:
    - { hour: 3,  ratio: 0.125 } # 00:00-06:00 (Night min: 12.5%)
    - { hour: 7,  ratio: 0.500 } # 06:00-09:00 (Morning buildup: 50%)
    - { hour: 10, ratio: 0.875 } # 09:00-12:00 (Morning peak: 87.5%)
    - { hour: 13, ratio: 0.500 } # 12:00-15:00 (Midday lull: 50%)
    - { hour: 16, ratio: 0.750 } # 15:00-18:00 (Afternoon buildup: 75%)
    - { hour: 19, ratio: 1.000 } # 18:00-21:00 (Main Evening Rush Peak: 100%)
    - { hour: 22, ratio: 0.250 } # 21:00-00:00 (Late evening wind-down: 25%)

  # Central Zone
  center:
    lat: 55.7879
    lon: 49.1221
    radius_km: 4.5

  # Residential Hubs
  residential:
    - { name: "Kvartala", lat: 55.8285, lon: 49.1245, radius_km: 2.0, weight: 0.40 }
    - { name: "Gorki_Azino", lat: 55.7645, lon: 49.2145, radius_km: 2.5, weight: 0.40 }
    - { name: "Aviastroitelny", lat: 55.8550, lon: 49.0850, radius_km: 2.0, weight: 0.20 }

  # Suburb Gates
  suburbs:
    - { name: "Innopolis", lat: 55.7440, lon: 48.7450, radius_km: 1.0, weight: 0.35 }
    - { name: "Vysokaya_Gora", lat: 55.9120, lon: 49.3050, radius_km: 1.0, weight: 0.35 }
    - { name: "Salavat_Kupere", lat: 55.8340, lon: 48.9350, radius_km: 1.5, weight: 0.30 }

  # Deadlock & Queue Mitigation Subsystem (SUMO Virtual Buffer vs Cities Skylines Despawn)
  deadlock_mitigation:
    enabled: true
    mode: "sumo_virtual_buffer"  # Modes: sumo_virtual_buffer, cs_despawn_target, cs_despawn_home
    time_to_teleport_sec: 300.0
    min_virtual_speed_mps: 2.0

