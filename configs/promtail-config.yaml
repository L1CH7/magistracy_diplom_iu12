# Promtail configuration for scraping application logs and sending to Loki
#
# This config monitors JSON log files from .agent_dir/logs/ and ships them to Loki
# for fast log search and visualization in Grafana.
#
# Log files monitored:
# - app.jsonl: all application logs
# - errors.jsonl: ERROR level and above
# - slow_operations.jsonl: operations >1 second
#
# Usage:
#   docker-compose up -d  (starts Loki, Promtail, and Grafana)
#   Grafana: http://localhost:3000 (admin/admin)
#   Loki queries: {job="app_logs"} | json | level="ERROR"

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Server logs (all levels)
  - job_name: server_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: server_logs
          application: navigation_mas
          container: server
          environment: development
          __path__: /var/log/app/server/app.jsonl
    
    pipeline_stages:
      # Parse loguru serialize=True format: {text, record}
      - json:
          expressions:
            level: record.level.name
            logger: record.name
            message: record.message
            function: record.function
            line: record.line
            module: record.module
            timestamp: record.time.repr
            thread_id: record.extra.thread_id
      
      # Extract labels for Loki indexing
      - labels:
          level:
          logger:
          function:
          container:
      
      # Set timestamp from log entry
      - timestamp:
          source: timestamp
          format: RFC3339Nano
  
  # Client logs (all levels)
  - job_name: client_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: client_logs
          application: navigation_mas
          container: client
          environment: development
          __path__: /var/log/app/client/app.jsonl
    
    pipeline_stages:
      # Parse loguru serialize=True format: {text, record}
      - json:
          expressions:
            level: record.level.name
            logger: record.name
            message: record.message
            function: record.function
            line: record.line
            module: record.module
            timestamp: record.time.repr
            agent_id: record.extra.agent_id
            thread_id: record.extra.thread_id
      
      # Extract labels for Loki indexing
      - labels:
          level:
          logger:
          function:
          container:
          agent_id:
      
      # Set timestamp from log entry
      - timestamp:
          source: timestamp
          format: RFC3339Nano
  
  # Server error logs (fast error detection)
  - job_name: server_errors
    static_configs:
      - targets:
          - localhost
        labels:
          job: server_errors
          application: navigation_mas
          container: server
          severity: error
          environment: development
          __path__: /var/log/app/server/errors.jsonl
    
    pipeline_stages:
      - json:
          expressions:
            level: record.level.name
            logger: record.name
            message: record.message
            timestamp: record.time.repr
            exception_type: record.exception.type
      
      - labels:
          level:
          logger:
          exception_type:
          container:
      
      - timestamp:
          source: timestamp
          format: RFC3339Nano
  
  # Client error logs
  - job_name: client_errors
    static_configs:
      - targets:
          - localhost
        labels:
          job: client_errors
          application: navigation_mas
          container: client
          severity: error
          environment: development
          __path__: /var/log/app/client/errors.jsonl
    
    pipeline_stages:
      - json:
          expressions:
            level: record.level.name
            logger: record.name
            message: record.message
            timestamp: record.time.repr
            exception_type: record.exception.type
      
      - labels:
          level:
          logger:
          exception_type:
          container:
      
      - timestamp:
          source: timestamp
          format: RFC3339Nano
