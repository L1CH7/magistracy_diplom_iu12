# Overpass API Configuration
# Settings for OSM data fetching from Overpass servers

# Server priority: which servers to try first
# "de" - German servers (reliable, slower for Moscow)
# "ru" - Russian servers (faster for Moscow, may timeout)
server_priority: "de"

# Primary servers (prefer these)
primary_servers:
  # Russian servers (VK maps) - usually faster for Russian data
  - "https://maps.mail.ru/osm/tools/overpass/api/interpreter"
  - "https://overpass.openstreetmap.ru/api/interpreter"
  - "https://overpass.openstreetmap.ru/cgi/interpreter"

# Fallback servers (if primary fail)
fallback_servers:
  # German servers - reliable but slower for Russian data
  - "https://overpass-api.de/api/interpreter"
  - "https://overpass.kumi.systems/api/interpreter"

# Timeout for Overpass requests (seconds)
timeout: 300  # 5 minutes (increased from 180)

# Retry settings for download failures
retry:
  # Max retries with SAME server before switching
  max_retries_per_server: 3
  
  # Delay between retries (seconds) - will use exponential backoff
  initial_retry_delay: 5   # First retry after 5s
  max_retry_delay: 60      # Max delay 60s (backoff caps here)
  backoff_multiplier: 2    # Each retry: delay *= 2
  
  # Max servers to try (primary + fallback)
  max_servers_to_try: 5    # Try up to 5 different servers total

# Tile size for grid-based downloads (degrees)
# Smaller = more tiles, faster per-tile, better progress visibility
# 0.05 = ~5.5km (Moscow medium: 5x5 = 25 tiles)
# 0.01 = ~1.1km (Moscow micro: 5x5 = 25 tiles, fast demo)
# 0.005 = ~550m (Moscow medium: 50x50 = 2500 tiles, long download, great dynamics)
tile_size_degrees: 0.01
